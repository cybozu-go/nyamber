name: Setup Go with Takumi Guard
description: ''
inputs:
  bot-id:
    description: "Takumi Guard bot ID"
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
    - uses: flatt-security/setup-takumi-guard-golang@37631ecffa6faf06754444a4807451b7a55c64b5 # v1.2.0
      with:
        bot-id: ${{ inputs.bot-id }}
